<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourly Weather</title>
<style>
  /* Fixed light palette so text stays readable on the #F9ECE0 fill in light and dark mode */
  :root { --fg:#37352f; --muted:#8c7d70; --rain:#2f80ed; --fill:#F9ECE0; --pill:rgba(55,53,47,.08); --pillOn:#fff; --shadow:0 1px 2px rgba(0,0,0,.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    background:transparent; color:var(--fg);
    font-family:Lyon-Text, Georgia, ui-serif, "Times New Roman", serif;
    -webkit-font-smoothing:antialiased;
  }
  .w { padding:16px 20px; background:var(--fill); border-radius:10px; border:0; }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .place { font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .toggle { display:inline-flex; gap:10px; }
  .toggle button { border:0; background:transparent; color:var(--muted); padding:0; cursor:pointer; line-height:0; }
  .toggle button svg { width:18px; height:18px; }
  .toggle button.on { color:#CC792F; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; margin-top:8px; }
  .now { font-size:44px; font-weight:300; line-height:1; letter-spacing:-.02em; }
  .cond { display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:15px; font-weight:500; text-align:right; }
  .cond svg { width:28px; height:28px; }
  .cond .p { font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); row-gap:18px; margin-top:24px; }
  /* Hairline marking where tomorrow begins */
  .rule { grid-column:1 / -1; height:1px; background:rgba(55,53,47,.2); margin:-8px 0; }
  .h.split { border-left:1px solid rgba(55,53,47,.2); }
  .h { display:flex; flex-direction:column; align-items:center; gap:7px; }
  .t { font-size:13px; color:var(--muted); font-weight:500; white-space:nowrap; }
  .h svg { width:22px; height:22px; }
  .d { font-size:16px; font-weight:600; }
  .p { font-size:11px; color:var(--rain); font-weight:600; min-height:13px; }
  .msg { color:var(--muted); font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<div class="w">
  <div class="head">
    <div class="place" id="place"></div>
    <div class="toggle" role="tablist">
      <button data-loc="home" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M12 2.5 2 10.3V21h7.5v-6h5v6H22V10.3z"/></svg></button>
      <button data-loc="work" aria-label="Work" title="Work"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7h-2V5.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5V7z"/><rect x="2" y="7" width="20" height="13" rx="2.5"/></svg></button>
    </div>
  </div>
  <div id="app" class="msg">Loading weather…</div>
</div>
<script>
  const LOCS = {
    home: { name: "Hudson Yards", lat: 40.7537, lon: -74.0016 }, // Hudson Yards, postcode 10001
    work: { name: "WTC", lat: 40.7127, lon: -74.0134 }  // World Trade Center
  };
  const LAST_HOUR = 22;  // show at least through 10 PM
  const COLS = 5;        // icons per row

  let loc = "home";
  try { if (LOCS[localStorage.getItem("wx-loc")]) loc = localStorage.getItem("wx-loc"); } catch (e) {}

  const LABEL = {0:"Clear",1:"Mainly Clear",2:"Partly Cloudy",3:"Overcast",45:"Fog",48:"Fog",
    51:"Light Drizzle",53:"Drizzle",55:"Heavy Drizzle",56:"Freezing Drizzle",57:"Freezing Drizzle",
    61:"Light Rain",63:"Rain",65:"Heavy Rain",66:"Freezing Rain",67:"Freezing Rain",
    71:"Light Snow",73:"Snow",75:"Heavy Snow",77:"Snow",80:"Showers",81:"Showers",82:"Heavy Showers",
    85:"Snow Showers",86:"Snow Showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};

  function kind(code, day) {
    if (code <= 1) return day ? "sun" : "moon";
    if (code === 2) return day ? "partly" : "partlyNight";
    if (code === 3) return "cloud";
    if (code === 45 || code === 48) return "fog";
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 95) return "storm";
    return "cloud";
  }

  function rays(cx, cy, r1, r2, angles) {
    return angles.map(a => {
      const t = a * Math.PI / 180;
      return '<line x1="' + (cx + r1*Math.cos(t)).toFixed(2) + '" y1="' + (cy + r1*Math.sin(t)).toFixed(2)
        + '" x2="' + (cx + r2*Math.cos(t)).toFixed(2) + '" y2="' + (cy + r2*Math.sin(t)).toFixed(2) + '"/>';
    }).join("");
  }

  const CLOUD = '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>';
  const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const NS = s => s.replace("<path", '<path vector-effect="non-scaling-stroke"');
  const ALL = [0,45,90,135,180,225,270,315];

  function svg(k) {
    let b = "";
    if (k === "sun") b = '<circle cx="12" cy="12" r="4"/>' + rays(12,12,6.5,8.5,ALL);
    else if (k === "moon") b = MOON;
    else if (k === "cloud") b = CLOUD;
    else if (k === "partly") b = '<circle cx="16.5" cy="7.5" r="2.6"/>' + rays(16.5,7.5,4.2,5.6,[225,270,315,0,45])
      + '<g transform="translate(0 6) scale(.75)">' + NS(CLOUD) + '</g>';
    else if (k === "partlyNight") b = '<g transform="translate(11 0) scale(.5)">' + NS(MOON) + '</g>'
      + '<g transform="translate(0 6) scale(.75)">' + NS(CLOUD) + '</g>';
    else if (k === "rain") b = '<path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/>';
    else if (k === "snow") b = '<path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="8" y1="20" x2="8.01" y2="20"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="12" y1="22" x2="12.01" y2="22"/><line x1="16" y1="16" x2="16.01" y2="16"/><line x1="16" y1="20" x2="16.01" y2="20"/>';
    else if (k === "storm") b = '<path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/>';
    else if (k === "fog") b = '<line x1="4" y1="9" x2="20" y2="9"/><line x1="2" y1="13" x2="22" y2="13"/><line x1="5" y1="17" x2="19" y2="17"/>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + b + '</svg>';
  }

  function hourLabel(t) {
    const h = +t.slice(11, 13);
    return (h % 12 || 12) + (h < 12 ? "AM" : "PM");
  }

  function setToggle() {
    document.querySelectorAll(".toggle button").forEach(btn =>
      btn.classList.toggle("on", btn.dataset.loc === loc));
    document.getElementById("place").textContent = LOCS[loc].name;
  }

  async function load() {
    const app = document.getElementById("app");
    const L = LOCS[loc];
    const api = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + L.lat + "&longitude=" + L.lon
      + "&current=temperature_2m,weather_code,is_day"
      + "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"
      + "&temperature_unit=celsius&timezone=America%2FNew_York&forecast_days=3";
    try {
      const res = await fetch(api);
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      const c = d.current, H = d.hourly;
      const today = c.time.slice(0, 10);
      const nowIdx = H.time.findIndex(t => t.slice(0, 13) === c.time.slice(0, 13));
      // Count hours from index `from` through 10 PM on that same day.
      const untilLast = from => {
        const day = H.time[from] ? H.time[from].slice(0, 10) : "";
        let k = 0;
        for (let i = from; i < H.time.length; i++) {
          if (H.time[i].slice(0, 10) !== day || +H.time[i].slice(11, 13) > LAST_HOUR) break;
          k++;
        }
        return k;
      };

      const start = nowIdx + 1;
      const left = H.time[start] && H.time[start].slice(0, 10) === today ? untilLast(start) : 0;
      let idx = [];
      let split = -1; // position in idx where tomorrow begins

      if (left > COLS) {
        // Normal: through 10 PM, rounded up to fill complete rows of 5.
        let n = Math.ceil(left / COLS) * COLS;
        for (let i = start; i < Math.min(start + n, H.time.length); i++) idx.push(i);
      } else {
        // One row or less left: today's remaining hours, then tomorrow from 5 AM to fill two rows.
        for (let i = start; i < start + left; i++) idx.push(i);
        const morning = H.time.findIndex(t => t.slice(0, 10) > today && t.slice(11, 13) === "05");
        split = idx.length;
        for (let i = morning; idx.length < COLS * 2 && i < H.time.length; i++) idx.push(i);
      }

      let cells = "";
      idx.forEach((i, j) => {
        let cls = "h";
        if (j === split) {
          if (j % COLS === 0) cells += '<div class="rule"></div>'; // tomorrow starts a new row
          else cls += " split";                                      // tomorrow starts mid-row
        }
        const p = H.precipitation_probability[i];
        cells += '<div class="' + cls + '"><div class="t">' + hourLabel(H.time[i]) + '</div>'
          + svg(kind(H.weather_code[i], H.is_day[i]))
          + '<div class="d">' + Math.round(H.temperature_2m[i]) + '°</div>'
          + '<div class="p">' + (p > 0 ? p + '%' : '') + '</div></div>';
      });

      const pNow = H.precipitation_probability[nowIdx];
      app.className = "";
      app.innerHTML =
        '<div class="top"><div class="now">' + Math.round(c.temperature_2m) + '°</div>'
        + '<div class="cond">' + svg(kind(c.weather_code, c.is_day))
        + '<div>' + (LABEL[c.weather_code] || "") + '</div>'
        + (pNow > 0 ? '<div class="p">' + pNow + '% chance of precipitation</div>' : '')
        + '</div></div>'
        + '<div class="grid">' + cells + '</div>';
    } catch (e) {
      app.className = "msg";
      app.textContent = "Weather unavailable right now.";
    }
  }

  document.querySelectorAll(".toggle button").forEach(btn => btn.addEventListener("click", () => {
    loc = btn.dataset.loc;
    try { localStorage.setItem("wx-loc", loc); } catch (e) {}
    setToggle();
    load();
  }));

  setToggle();
  load();
  setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
