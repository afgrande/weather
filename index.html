<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourly Weather</title>
<style>
  :root { --fg:#37352f; --muted:#9b9a97; --rain:#2f80ed; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e6e4; --muted:#8a8a87; --rain:#5aa3ff; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    background:transparent; color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .w { padding:16px 20px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .place { font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .now { font-size:64px; font-weight:300; line-height:1; margin-top:6px; letter-spacing:-.03em; }
  .cond { display:flex; flex-direction:column; align-items:flex-end; gap:16px; font-size:15px; font-weight:500; padding-top:2px; text-align:right; }
  .cond svg { width:30px; height:30px; }
  .hours { display:flex; gap:4px; overflow-x:auto; margin-top:24px; scrollbar-width:none; }
  .hours::-webkit-scrollbar { display:none; }
  .h { flex:0 0 56px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .t { font-size:13px; color:var(--muted); font-weight:500; white-space:nowrap; }
  .h svg { width:22px; height:22px; }
  .d { font-size:16px; font-weight:600; }
  .p { font-size:11px; color:var(--rain); font-weight:600; min-height:13px; }
  .msg { color:var(--muted); font-size:13px; padding:16px 20px; }
</style>
</head>
<body>
<div id="app" class="msg">Loading weather…</div>
<script>
  // Postcode 10001 (Chelsea / Hudson Yards, Manhattan)
  const LAT = 40.7506, LON = -73.9971;
  const PLACE = "Manhattan";
  const LAST_HOUR = 22; // show hours through 10 PM

  const API = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + LAT + "&longitude=" + LON
    + "&current=temperature_2m,weather_code,is_day"
    + "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"
    + "&temperature_unit=celsius&timezone=America%2FNew_York&forecast_days=2";

  const LABEL = {0:"Clear",1:"Mainly Clear",2:"Partly Cloudy",3:"Overcast",45:"Fog",48:"Fog",
    51:"Light Drizzle",53:"Drizzle",55:"Heavy Drizzle",56:"Freezing Drizzle",57:"Freezing Drizzle",
    61:"Light Rain",63:"Rain",65:"Heavy Rain",66:"Freezing Rain",67:"Freezing Rain",
    71:"Light Snow",73:"Snow",75:"Heavy Snow",77:"Snow",80:"Showers",81:"Showers",82:"Heavy Showers",
    85:"Snow Showers",86:"Snow Showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};

  function kind(code, day) {
    if (code <= 1) return day ? "sun" : "moon";
    if (code === 2) return day ? "partly" : "partlyNight";
    if (code === 3) return "cloud";
    if (code === 45 || code === 48) return "fog";
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 95) return "storm";
    return "cloud";
  }

  function rays(cx, cy, r1, r2, angles) {
    return angles.map(a => {
      const t = a * Math.PI / 180;
      return '<line x1="' + (cx + r1*Math.cos(t)).toFixed(2) + '" y1="' + (cy + r1*Math.sin(t)).toFixed(2)
        + '" x2="' + (cx + r2*Math.cos(t)).toFixed(2) + '" y2="' + (cy + r2*Math.sin(t)).toFixed(2) + '"/>';
    }).join("");
  }

  const CLOUD = '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>';
  const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const ALL = [0,45,90,135,180,225,270,315];

  function svg(k) {
    let body = "";
    if (k === "sun") body = '<circle cx="12" cy="12" r="4"/>' + rays(12,12,6.5,8.5,ALL);
    else if (k === "moon") body = MOON;
    else if (k === "cloud") body = CLOUD;
    else if (k === "partly") body = '<circle cx="16.5" cy="7.5" r="2.6"/>' + rays(16.5,7.5,4.2,5.6,[225,270,315,0,45])
      + '<g transform="translate(0 6) scale(.75)">' + CLOUD.replace("<path", '<path vector-effect="non-scaling-stroke"') + '</g>';
    else if (k === "partlyNight") body = '<g transform="translate(11 0) scale(.5)">' + MOON.replace("<path", '<path vector-effect="non-scaling-stroke"') + '</g>'
      + '<g transform="translate(0 6) scale(.75)">' + CLOUD.replace("<path", '<path vector-effect="non-scaling-stroke"') + '</g>';
    else if (k === "rain") body = '<path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/>';
    else if (k === "snow") body = '<path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="8" y1="20" x2="8.01" y2="20"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="12" y1="22" x2="12.01" y2="22"/><line x1="16" y1="16" x2="16.01" y2="16"/><line x1="16" y1="20" x2="16.01" y2="20"/>';
    else if (k === "storm") body = '<path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/>';
    else if (k === "fog") body = '<line x1="4" y1="9" x2="20" y2="9"/><line x1="2" y1="13" x2="22" y2="13"/><line x1="5" y1="17" x2="19" y2="17"/>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
  }

  function hourLabel(t) {
    const h = +t.slice(11, 13);
    return (h % 12 || 12) + (h < 12 ? "AM" : "PM");
  }

  async function load() {
    const app = document.getElementById("app");
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      const c = d.current, H = d.hourly;
      const today = c.time.slice(0, 10);
      const nowIdx = H.time.findIndex(t => t.slice(0, 13) === c.time.slice(0, 13));
      const start = nowIdx + 1;

      let idx = [];
      for (let i = start; i < H.time.length; i++) {
        if (H.time[i].slice(0, 10) !== today || +H.time[i].slice(11, 13) > LAST_HOUR) break;
        idx.push(i);
      }
      if (idx.length < 4) { // late evening: show the next 12 hours instead
        idx = [];
        for (let i = start; i < Math.min(start + 12, H.time.length); i++) idx.push(i);
      }

      const hours = idx.map(i => {
        const p = H.precipitation_probability[i];
        return '<div class="h"><div class="t">' + hourLabel(H.time[i]) + '</div>'
          + svg(kind(H.weather_code[i], H.is_day[i]))
          + '<div class="d">' + Math.round(H.temperature_2m[i]) + '°</div>'
          + '<div class="p">' + (p >= 10 ? p + '%' : '') + '</div></div>';
      }).join("");

      app.className = "w";
      app.innerHTML =
        '<div class="top"><div><div class="place">' + PLACE + '</div>'
        + '<div class="now">' + Math.round(c.temperature_2m) + '°</div></div>'
        + '<div class="cond">' + svg(kind(c.weather_code, c.is_day))
        + '<div>' + (LABEL[c.weather_code] || "") + '</div></div></div>'
        + '<div class="hours">' + hours + '</div>';
    } catch (e) {
      app.className = "msg";
      app.textContent = "Weather unavailable right now.";
    }
  }

  load();
  setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
